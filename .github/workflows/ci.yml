name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: npx tsc --noEmit
      - name: the reference survives losing its demonstration
        run: |
          rm -rf lab
          node check/no-lab.ts
          npx tsc --noEmit
          pnpm build
